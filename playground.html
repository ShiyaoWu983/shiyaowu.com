<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Playground — Shiyao Wu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Newsreader:opsz,wght@6..72,400&display=swap">
<style>html.sw-hold body { opacity: 0; } body { transition: opacity .25s ease; }</style>
<script>document.documentElement.classList.add('sw-hold'); setTimeout(() => document.documentElement.classList.remove('sw-hold'), 2500);</script>
<style>
/* Direction 3 — studio-style one-pager, modeled on the serious.business framework:
   full-width wordmark → mixed-type hero + expanding reel → stat ticker + statement →
   stacked service bands (accordion) → 2-up project grid → recognition list → CTA footer.
   24px frame. Mixed titles = sans line + serif line. All content is placeholder. */
:root {
  --bg: #F3F3F3;
  --fg: #000000;
  --muted: #8C8C8C;
  --ph: #C4C4C4;
  --ph-ink: #9A9A9A;
  --pill: #FFFFFF;
  /* service bands — placeholder colors, swap for the brand palette later */
  --band-1: #DCDCDC;
  --band-2: #FFFFFF;
  --band-3: #C4C4C4;
  --band-4: #1E1E1E;
  --band-4-ink: #F3F3F3;

  --sans: 'Inter', -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --serif: 'Newsreader', 'Times New Roman', Georgia, serif;

  --fs-xs: 11px;
  --fs-s: 13px;
  --fs-m: clamp(17px, 1.67vw, 23px);     /* hero / section subtitles */
  --fs-l: clamp(31px, 5vw, 71px);        /* statements */
  --fs-xl: clamp(43px, 7.3vw, 104px);    /* service band titles */

  --frame: 24px;
  --gap: 16px;
  --radius: 6px;
  color-scheme: light;
}
* { box-sizing: border-box; }
img { max-width: 100%; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  font-size: var(--fs-s);
  line-height: 1.3;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
p, h1, h2, h3, h4 { margin: 0; font-weight: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }

.frame { padding-inline: var(--frame); }

/* ---------- Shared bits ---------- */
.mixed { display: flex; flex-direction: column; align-items: center; text-align: center; line-height: 1; text-wrap: balance; }
.mixed .main { font-family: var(--sans); font-weight: 500; letter-spacing: -0.01em; }
.mixed .sub { font-family: var(--serif); font-weight: 400; }

.pill {
  display: inline-flex; align-items: center; height: 39px;
  font-size: 15px; font-weight: 500;   /* same size as header + project text */
}
@media (max-width: 640px) { .pill, .replay { font-size: 13px; } }
.pill .label { background: var(--pill); border-radius: 20px; padding: 0 18px; height: 100%; display: flex; align-items: center; }
.pill .dot {
  width: 39px; height: 39px; border-radius: 50%; background: var(--pill);
  display: grid; place-items: center; transition: transform .25s ease;
}
.pill:hover .dot { transform: rotate(-45deg); }
.pill:hover .label { background: var(--fg); color: var(--bg); }
.pill .label, .pill .dot { transition: background .2s, color .2s, transform .25s; }

.ph { position: relative; background: var(--ph); border-radius: var(--radius); overflow: hidden; }
.ph-label { position: absolute; left: 12px; bottom: 10px; font-size: var(--fs-xs); color: var(--ph-ink); font-variant-numeric: tabular-nums; }
.ph img, .ph video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

.section-label { font-size: var(--fs-s); font-weight: 500; }

/* ---------- Fixed nav (pills) ---------- */
.nav {
  position: fixed; z-index: 20; left: 0; right: 0;
  top: calc(env(safe-area-inset-top, 0px) + 16px);
  display: flex; justify-content: space-between;
  padding-inline: var(--frame);
  pointer-events: none;
  opacity: 0; transform: translateY(-8px);
  transition: opacity .25s ease, transform .25s ease;
}
.nav.is-on { opacity: 1; transform: none; }
.nav .pill { pointer-events: auto; }

/* ---------- Menu overlay ---------- */
.menu {
  position: fixed; inset: 0; z-index: 30;
  background: var(--fg); color: var(--bg);
  padding: calc(env(safe-area-inset-top, 0px) + 24px) var(--frame) 24px;
  display: flex; flex-direction: column; justify-content: space-between;
}
[hidden] { display: none !important; }
.menu .menu-close { align-self: flex-end; font-size: var(--fs-s); font-weight: 500; border: 1px solid currentColor; border-radius: 20px; height: 39px; padding: 0 18px; }
.menu nav { display: flex; flex-direction: column; }
.menu nav a { font-size: var(--fs-xl); font-weight: 500; line-height: 1.05; letter-spacing: -0.02em; }
.menu nav a:hover { font-family: var(--serif); font-weight: 400; }
.menu .menu-foot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: var(--fs-s); }

/* ---------- Hero ---------- */
.hero { padding-block: 0; position: relative; }
.wordmark { display: block; width: 100%; height: auto; }
.wordmark text { font-family: var(--sans); font-weight: 800; fill: var(--fg); }
/* Name sits over the reel. White + difference blend = black on the light page,
   and the opposite color of whatever is behind it (the reel, images, dark bands). */
.hero-name {
  position: relative; z-index: 5;
  padding-top: 72px;   /* clears the Contact / Menu pills */
  mix-blend-mode: difference;
  pointer-events: none;
}
.hero-name .wordmark text { fill: #FFFFFF; }
.hero-role { color: #FFFFFF; font-size: var(--fs-m); font-weight: 500; margin-top: 12px; }
.reel-stage { position: relative; }   /* spacer: height set in JS so content starts below the reel */
/* Reel slides up behind the name, pins, then shrinks into the bottom-left corner as you keep scrolling */
/* Reel is fixed behind the name; on scroll it shrinks into the bottom-left corner until it's gone,
   floating over the content that scrolls up beneath it */
.reel {
  position: fixed; z-index: 4;
  top: calc(env(safe-area-inset-top, 0px) + var(--frame));
  left: var(--frame); right: var(--frame);
  transform-origin: 0 100%; will-change: transform, opacity;
}
.reel.is-gone { visibility: hidden; }
.reel.is-passive { pointer-events: none; }
/* Dark placeholder so the name's color flip is visible before real footage goes in */
.reel .ph { background: var(--band-4); }
.reel .ph-label { color: #6E6E6E; }
.reel .ph { height: min(calc((100vw - 2 * var(--frame)) * 9 / 16), calc(100vh - 2 * var(--frame))); border-radius: var(--radius); }
.reel-play {
  position: absolute; right: 16px; bottom: 12px;
  font-size: var(--fs-xs); font-weight: 500;
  background: var(--pill); border-radius: 20px; padding: 8px 14px;
}

/* ---------- Facts ---------- */
.facts { padding-block: 160px 0; }
.ticker { overflow: hidden; mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); }
.ticker-track { display: flex; gap: 24px; width: max-content; animation: tick 28s linear infinite; }
.ticker:hover .ticker-track { animation-play-state: paused; }
.stat { width: 200px; display: flex; flex-direction: column; gap: 6px; }
.stat .num { font-size: 39px; font-weight: 500; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.stat .cap { font-size: var(--fs-xs); color: var(--muted); }
@keyframes tick { to { transform: translateX(-50%); } }
.statement { display: flex; flex-direction: column; gap: 28px; align-items: flex-start; }
.statement h2 { font-size: var(--fs-l); line-height: 1; letter-spacing: -0.02em; font-weight: 500; text-wrap: balance; max-width: 18ch; }
.statement h2 em { font-family: var(--serif); font-style: normal; font-weight: 400; }

/* ---------- Services (stacked bands) ---------- */
.services { padding-top: 200px; }
.services .section-label { padding-inline: var(--frame); margin-bottom: 12px; display: block; }
.band { background: var(--c); color: var(--ink, var(--fg)); }
.band:nth-child(1) { --c: var(--band-1); }
.band:nth-child(2) { --c: var(--band-2); }
.band:nth-child(3) { --c: var(--band-3); }
.band:nth-child(4) { --c: var(--band-4); --ink: var(--band-4-ink); }
.band-head {
  width: 100%; text-align: left; display: flex; justify-content: space-between; align-items: center;
  padding: 0 var(--frame); min-height: 1.4em;
  font-size: var(--fs-xl); font-weight: 500; letter-spacing: -0.03em; line-height: 1;
}
.band-head .plus { font-size: 0.4em; font-weight: 400; transition: transform .3s ease; }
.band.is-open .band-head .plus { transform: rotate(45deg); }
.band-body {
  display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s ease;
}
.band.is-open .band-body { grid-template-rows: 1fr; }
.band-body > div { overflow: hidden; }
.band-inner {
  display: grid; grid-template-columns: 2fr 1fr 3fr; gap: 24px var(--gap);
  padding: 8px var(--frame) 32px;
}
/* Horizontal image strip inside each discipline — bleeds to the right edge */
.band-strip {
  grid-column: 1 / -1;
  display: flex; gap: var(--gap);
  margin-right: calc(-1 * var(--frame)); padding-right: var(--frame);
  overflow-x: auto; overscroll-behavior-x: contain;
  scroll-snap-type: x mandatory; scrollbar-width: none;
  cursor: grab;
}
.band-strip::-webkit-scrollbar { display: none; }
.band-strip.is-dragging { cursor: grabbing; scroll-snap-type: none; user-select: none; }
.band-strip:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
.band-strip .ph { flex: 0 0 auto; height: clamp(220px, 26vw, 380px); scroll-snap-align: start; }
.band-strip .ph--wide { aspect-ratio: 3 / 2; }
.band-strip .ph--tall { aspect-ratio: 4 / 5; }
.strip-hint { grid-column: 1 / -1; display: flex; justify-content: space-between; font-size: var(--fs-xs); opacity: .6; margin-top: -12px; }
.band-inner p { font-size: var(--fs-m); line-height: 1.15; max-width: 26ch; }
.band-inner ul { list-style: none; margin: 0; padding: 0; font-size: var(--fs-xs); line-height: 1.5; }

/* ---------- Work ---------- */
.work { padding-block: 200px 0; }
.work .mixed { font-size: var(--fs-l); margin-bottom: 64px; }
.work .mixed .main { font-weight: 500; letter-spacing: -0.02em; }
.work-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--frame); }   /* same as the site's outer margin */
.card { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card .ph { aspect-ratio: 689 / 460; max-width: 100%; transition: border-radius .3s ease; }
@media (hover: hover) { .card:hover .ph { border-radius: 24px; } }   /* no corner change on touch screens */
.card-meta { display: flex; flex-direction: column; gap: 4px; }
.card-title { font-size: 17px; font-weight: 500; }
.card-title span { background: linear-gradient(currentColor, currentColor) 0 100% / 0 1px no-repeat; transition: background-size .3s ease; }
.card-tags { font-size: var(--fs-xs); color: var(--muted); }
.work-more { display: flex; justify-content: center; margin-top: var(--frame); }

/* ---------- Recognition ---------- */
.recog { padding-block: 200px 0; }
.recog .mixed { font-size: var(--fs-l); margin-bottom: 48px; }
.recog-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 48px var(--gap); align-items: start; }
.recog-col h3 { font-size: var(--fs-s); font-weight: 500; margin-bottom: 12px; }
.recog-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--fg); }
.recog-list li {
  display: grid; grid-template-columns: 1fr auto; gap: 4px var(--gap); align-items: baseline;
  padding: 18px 0; border-bottom: 1px solid var(--fg); font-size: var(--fs-m);
}
.recog-list .what { grid-column: 1 / -1; grid-row: 2; font-size: var(--fs-s); color: var(--muted); }
.recog-list .yr { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.recog-list li:hover { padding-left: 12px; }
.recog-list li { transition: padding .25s ease; }

/* ---------- Footer ---------- */
.footer { padding-block: 120px 24px; }
.cta { display: flex; flex-direction: column; align-items: center; gap: 28px; }
.cta .mixed { font-size: var(--fs-l); }
.foot-cols { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--gap); margin-top: 180px; }
.foot-cols h4 { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 10px; font-weight: 500; }
.foot-cols a { display: block; font-size: var(--fs-m); line-height: 1.2; }
.foot-cols a:hover { font-family: var(--serif); }
.foot-bottom {
  display: grid; grid-template-columns: 1fr auto 1fr; gap: var(--gap); margin-top: 0;
  font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.04em;
}
.foot-bottom > :last-child { justify-self: end; }
.footer .wordmark { margin-top: 24px; }

/* ---------- Tablet ---------- */
@media (max-width: 1000px) {
  .facts { grid-template-columns: 1fr; padding-top: 120px; gap: 48px; }
  .band-inner { grid-template-columns: 1fr 1fr; }
  .foot-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 32px; }
  .services, .work, .recog, .footer { padding-top: 140px; }
}
/* ---------- Phone ---------- */
@media (max-width: 640px) {
  :root { --frame: 16px; }
  .work-grid { grid-template-columns: 1fr; }
  .band-inner { grid-template-columns: 1fr; }
  .recog-cols { grid-template-columns: 1fr; }
  .foot-bottom { grid-template-columns: 1fr; }
  .foot-bottom > :last-child { justify-self: start; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .reel { position: absolute; }   /* no shrink: reel just scrolls with the page */
  *, *::before, *::after { transition: none !important; }
}

/* ---------- Header (after yimao.design): pinned flat bar + intro block that scrolls ---------- */
.site-bar {
  position: fixed; z-index: 30; top: 0; left: 0; right: 0;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) var(--frame) 14px;
  background: var(--bg);
  display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); column-gap: var(--frame); align-items: baseline;   /* after zefengd.com: name spans the left half; links take the 3 columns of the right half, which lines up with the gallery's right column */
  font-size: 18px; font-weight: 700; line-height: 1.3; color: var(--fg);   /* one size for every header item */
}
.site-bar a { transition: opacity .2s; }
.site-bar .bar-id { grid-column: span 3; display: flex; flex-direction: column; align-items: flex-start; }   /* name with a short intro underneath */
.site-bar .bar-last { grid-column: 6; justify-self: end; }   /* About Me on the right edge */
.site-bar .bar-intro { margin: 0; font-weight: 500; color: var(--muted); }   /* short intro under the name */
.site-bar { align-items: start; }
.site-bar a:hover, .site-bar a[aria-current="page"] { opacity: .45; }
.intro { padding-top: calc(env(safe-area-inset-top, 0px) + 50px); font-size: 12px; font-weight: 500; line-height: 1.3; }
.intro hr { border: 0; border-top: 1px solid var(--fg); margin: 0; }
.intro-row { display: grid; grid-template-columns: 34% 34% 1fr; gap: 0; padding-block: 20px 22px; }
.intro-row > div { padding-right: var(--frame); max-width: 62ch; }
.intro-row .lbl { display: block; }
.intro-ticker { overflow: hidden; white-space: nowrap; padding-block: 7px; }
.intro-ticker .track { display: inline-flex; gap: 4em; animation: intro-tick 40s linear infinite; }
.intro-ticker:hover .track { animation-play-state: paused; }
@keyframes intro-tick { to { transform: translateX(-50%); } }
@media (max-width: 900px) {
  .site-bar { grid-template-columns: 1fr auto auto auto; gap: 0 16px; font-size: 15px; }
  .site-bar .bar-intro { display: none; }
  .site-bar .bar-id { grid-column: auto; }
  .site-bar .bar-last { grid-column: auto; }
  .intro-row { grid-template-columns: 1fr; gap: 14px; }
}
@media (prefers-reduced-motion: reduce) { .intro-ticker .track { animation: none; } }
.foot-time { font-variant-numeric: tabular-nums; margin-left: .4em; }

/* Footer always sits at the bottom of the screen, even on short pages */
body { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
body > footer.footer { margin-top: auto; }
</style>
<style>
/* ---------- Playground: placeholder until the work is ready ---------- */
.soon { position: fixed; inset: 0; display: grid; place-items: center; padding: 0 var(--frame); text-align: center; pointer-events: none; }   /* centered on the screen */
.soon > div { pointer-events: auto; }
.soon h1 { margin: 0; font-size: clamp(31px, 4.4vw, 63px); font-weight: 500; letter-spacing: -0.02em; line-height: 1.1; }
.soon p { margin: 16px 0 0; font-size: 15px; font-weight: 500; color: var(--muted); }
@media (max-width: 640px) { .soon p { font-size: 13px; } }
</style>
<style>
/* No single word left alone on the last line of a paragraph */
p, h1, h2, h3, dd, li, .block-copy, .card-title, .tile-meta span, .more-meta span { text-wrap: pretty; }

/* ---------- Playground: a loose grid of single pieces. Click one to see it large with its title and description ---------- */
.pg { padding: calc(var(--bar-h, 56px) + 12px) var(--frame) 120px; }
.pg-head { display: flex; justify-content: space-between; align-items: baseline; gap: 24px; margin: 0 0 32px; }
.pg-head h1 { margin: 0; font-size: clamp(31px, 4.4vw, 63px); font-weight: 500; letter-spacing: -0.02em; line-height: 1.1; }
.pg-head p { margin: 0; max-width: 36ch; font-size: 15px; color: var(--muted); text-align: right; }
.pg-grid { columns: 4; column-gap: calc(var(--frame) / 2); }
.pg-item { display: block; width: 100%; margin: 0 0 calc(var(--frame) / 2); padding: 0; border: 0; background: none; cursor: zoom-in; break-inside: avoid; text-align: left; font: inherit; color: inherit; }
.pg-item .pg-media { position: relative; overflow: hidden; border-radius: var(--radius, 4px); background: var(--ph, #E4E4E4); transition: border-radius .3s ease; }
@media (hover: hover) { .pg-item:hover .pg-media, .pg-item:focus-visible .pg-media { border-radius: 24px; } }   /* no corner change on touch screens */
.pg-item img, .pg-item video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.pg-item .pg-ph { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; color: var(--ph-ink, #8C8C8C); }
@media (max-width: 1000px) { .pg-grid { columns: 3; } }
@media (max-width: 640px) {
  .pg { padding-top: calc(var(--bar-h, 48px) + 12px); }
  .pg-head { flex-direction: column; gap: 10px; }
  .pg-head p { text-align: left; font-size: 13px; }
  .pg-grid { columns: 2; }
}

/* Viewer: big image on the left, title + description on the right */
.pv { position: fixed; inset: 0; z-index: 200; background: var(--bg); display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 40px; padding: 64px var(--frame) 32px;
  opacity: 0; pointer-events: none; transition: opacity .3s ease; }
.pv.is-open { opacity: 1; pointer-events: auto; }
.pv-stage { position: relative; min-height: 0; display: grid; place-items: center; cursor: zoom-out; }
.pv-stage img, .pv-stage video { max-width: 100%; max-height: calc(100vh - 96px); object-fit: contain; display: block; }
.pv-stage .pv-ph { border-radius: var(--radius, 4px); } .pv-stage .pg-ph { display: grid; place-items: center; background: var(--ph, #E4E4E4); color: var(--ph-ink, #8C8C8C); font-size: 12px; border-radius: var(--radius, 4px); }
.pv-info { align-self: end; display: flex; flex-direction: column; gap: 12px; padding-bottom: 8px; }
.pv-info h2 { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.3; }
.pv-info p { margin: 0; font-size: 15px; line-height: 1.5; }
.pv-info .pv-meta { font-size: 13px; color: var(--muted); }
.pv-nav { display: flex; gap: 20px; align-items: center; margin-top: 12px; font-size: 13px; color: var(--muted); }
.pv button { background: none; border: 0; padding: 4px 0; font: inherit; color: var(--fg); cursor: pointer; }
.pv-nav button { font-size: 20px; line-height: 1; }
.pv-close { position: absolute; top: 16px; right: var(--frame); font-size: 13px !important; font-weight: 500; }
@media (max-width: 800px) {
  .pv { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; gap: 20px; padding: 56px 16px 24px; }
  .pv-stage img, .pv-stage video { max-height: calc(100vh - 260px); }
  .pv-info p { font-size: 13px; }
}
.pg-count { position: absolute; right: 10px; bottom: 10px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; line-height: 22px; text-align: center; }   /* how many images this piece has */
.pv-thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.pv-thumbs button { width: 56px; height: 56px; padding: 0; border-radius: 4px; overflow: hidden; opacity: .4; transition: opacity .2s; }
.pv-thumbs button.is-on, .pv-thumbs button:hover { opacity: 1; }
.pv-thumbs img, .pv-thumbs video { width: 100%; height: 100%; object-fit: cover; display: block; }
.pv { color: var(--fg); transition: opacity .3s ease, background-color .3s ease, color .3s ease; }
.pv.is-dark { --bg: #000000; --fg: #F3F3F3; --muted: #8C8C8C; background: #000000; }
.pv-stage video { width: 100%; height: calc(100vh - 96px); object-fit: contain; }   /* small loops (e.g. a GIF) scale up to fill the stage */
@media (max-width: 800px) { .pv-stage video { height: auto; max-height: calc(100vh - 260px); } }

/* Grid built as real columns (JS below), so every column starts exactly at the top */
.pg-grid { columns: auto; display: flex; align-items: flex-start; gap: calc(var(--frame) / 2); }
.pg-col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: calc(var(--frame) / 2); }
.pg-col .pg-item { margin: 0; }
/* Phones: the image takes the space that is left; the text below never gets covered */
@media (max-width: 800px) {
  .pv { height: 100dvh; }

<body>

<header class="site-bar">
  <div class="bar-id"><a class="bar-name" href="index.html">SHIYAO WU</a></div>

  </div>

<script>
// ---------- Playground pieces ----------
// One line per piece. imgs = its files in images/playground/ (.jpg/.png, or .mp4 for a loop) — the first one shows in the grid.
// A piece with several images just lists them all: imgs: ['images/playground/03-1.jpg', 'images/playground/03-2.jpg'].
// w/h = shape of the first image. dark: true = mostly dark images, shown on a black background. Leave imgs empty [] for a grey placeholder.
const PLAY = [
  { imgs: ['images/playground/01-1.jpg', 'images/playground/01-2.jpg', 'images/playground/01-3.jpg'], w: 2400, h: 1600, dark: true, title: 'Relaxing Bookmarks', meta: '', desc: 'A set of translucent bookmarks printed with soft, cloud-like forms — a small, calming object that marks a pause between pages.' },
  { imgs: ['images/playground/02.jpg'], w: 1600, h: 2404, dark: true, title: 'Dicotyledon', meta: '', desc: 'An information poster designed for the dicotyledon plants at The Huntington Library, Art Museum, and Botanical Gardens. Leaf specimens are arranged by size and annotated, turning the collection into a visual field guide.' },
  { imgs: ['images/playground/03.jpg', 'images/playground/03-2.mp4'], w: 1600, h: 2400, dark: true, title: 'The Glassware Collection', meta: '', desc: 'A poster cataloguing classic cocktail glassware, paired with a motion piece for each cocktail that shows the glass it is served in.' },
  { imgs: ['images/playground/05-1.mp4', 'images/playground/05-2.jpg'], w: 800, h: 450, dark: true, title: 'Spirofont Pattern', meta: '', desc: 'An interactive pattern generator, created before generative AI tools became widespread, that turns letters into spirograph-style patterns. Users choose a shape, a colour group and a size, draw the pattern by hand or let the tool draw it automatically, then type up to eight letters to weave into the design before downloading the result.' },
  { imgs: ['images/playground/06-1.jpg', 'images/playground/06-2.jpg', 'images/playground/06-3.jpg', 'images/playground/06-4.jpg', 'images/playground/06-5.jpg', 'images/playground/06-6.jpg', 'images/playground/06-7.jpg', 'images/playground/06-8.jpg'], w: 1600, h: 2400, dark: true, title: 'Chinatown Inside Out', meta: '', desc: 'An editorial zine built from the text of the book Chinatown Inside Out. Chapters such as “A Government Within a Government” and “The Female Triad” are set in an open layout that pairs archival photographs with generous white space.' },
];
(function () {
  // new random order on every visit
  for (let k = PLAY.length - 1; k > 0; k--) { const r = Math.floor(Math.random() * (k + 1)); [PLAY[k], PLAY[r]] = [PLAY[r], PLAY[k]]; }
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const ph = (w, h, shade) => 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='${w * 400}' height='${h * 400}'><rect width='100%' height='100%' fill='${shade}'/></svg>`);
  // every piece as a list of sources (placeholders get grey stand-ins)
  const srcs = p => p.imgs && p.imgs.length ? p.imgs : Array.from({ length: p.n || 1 }, (_, k) => ph(p.w, p.h, ['#C4C4C4', '#B4B4B4', '#D2D2D2', '#A9A9A9'][k % 4]));
  const poster = src => src.replace(/\.mp4$/i, '-poster.jpg');   // still frame shown before a loop starts
  const tag = (src, alt, lazy) => /\.mp4$/i.test(src) ? `<video src="${esc(src)}" poster="${esc(poster(src))}" autoplay muted loop playsinline></video>`
    : `<img src="${esc(src)}" alt="${esc(alt)}"${lazy ? ' loading="lazy"' : ''}>`;
  const grid = document.getElementById('pgGrid');
  grid.innerHTML = PLAY.map((p, i) => { const list = srcs(p);
    return `<button class="pg-item" type="button" data-i="${i}" aria-label="${esc(p.title)}"><div class="pg-media" style="aspect-ratio: ${p.w} / ${p.h}">${tag(list[0], p.title, true)}${list.length > 1 ? `<span class="pg-count">${list.length}</span>` : ''}</div></button>`; }).join('');
  // spread the pieces over real columns (shortest column first) so the tops line up
  const items = [...grid.children];
  const layout = () => {
    const n = innerWidth <= 640 ? 2 : innerWidth <= 1000 ? 3 : 4;
    if (grid.dataset.n == n) return; grid.dataset.n = n;
    const cols = Array.from({ length: n }, () => { const c = document.createElement('div'); c.className = 'pg-col'; return c; });
    const h = new Array(n).fill(0);
    items.forEach(el => { const p = PLAY[+el.dataset.i]; const k = h.indexOf(Math.min(...h)); cols[k].appendChild(el); h[k] += p.h / p.w + 0.05; });
    grid.replaceChildren(...cols);
  };
  layout(); addEventListener('resize', layout);
  const pv = document.getElementById('pv'), stage = document.getElementById('pvStage'), thumbs = document.getElementById('pvThumbs');
  let i = 0, j = 0;
  const showImg = k => { const p = PLAY[i], list = srcs(p); j = (k + list.length) % list.length;
    stage.innerHTML = tag(list[j], p.title, false);
    thumbs.querySelectorAll('button').forEach((b, n) => b.classList.toggle('is-on', n === j)); };
  const show = n => { i = (n + PLAY.length) % PLAY.length; const p = PLAY[i], list = srcs(p);
    pv.classList.toggle('is-dark', !!p.dark);   // dark pieces get a dark background
    document.getElementById('pvTitle').textContent = p.title;
    const meta = document.getElementById('pvMeta'); meta.textContent = p.meta || ''; meta.hidden = !p.meta;
    document.getElementById('pvDesc').textContent = p.desc || '';
    document.getElementById('pvCount').textContent = (i + 1) + ' / ' + PLAY.length;
    thumbs.innerHTML = list.length > 1 ? list.map((src, n) => `<button type="button" aria-label="Image ${n + 1}"><img src="${esc(/\.mp4$/i.test(src) ? poster(src) : src)}" alt=""></button>`).join('') : '';
    thumbs.hidden = list.length < 2;
    showImg(0); };
  const open = n => { show(n); pv.classList.add('is-open'); pv.setAttribute('aria-hidden', 'false'); document.documentElement.style.overflow = 'hidden'; };
  const close = () => { pv.classList.remove('is-open'); pv.setAttribute('aria-hidden', 'true'); document.documentElement.style.overflow = ''; };
  grid.addEventListener('click', e => { const b = e.target.closest('.pg-item'); if (b) open(+b.dataset.i); });
  thumbs.addEventListener('click', e => { const b = e.target.closest('button'); if (b) showImg([...thumbs.children].indexOf(b)); });
  pv.querySelector('.pv-close').onclick = close;
  stage.onclick = close;
  pv.querySelector('.pv-prev').onclick = () => show(i - 1);
  pv.querySelector('.pv-next').onclick = () => show(i + 1);
  addEventListener('keydown', e => { if (!pv.classList.contains('is-open')) return;
    if (e.key === 'Escape') close(); if (e.key === 'ArrowLeft') show(i - 1); if (e.key === 'ArrowRight') show(i + 1);
    if (e.key === 'ArrowDown') { e.preventDefault(); showImg(j + 1); } if (e.key === 'ArrowUp') { e.preventDefault(); showImg(j - 1); } });
  // header height for the top padding
  const bar = document.querySelector('.site-bar');
  const setH = () => document.documentElement.style.setProperty('--bar-h', bar.offsetHeight + 'px');
  setH(); addEventListener('resize', setH);
})();
</script>
<script>
// Footer: current city + live local time
(function () {
  const el = document.getElementById('footClock');
  if (!el) return;
  const fmt = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, timeZone: 'America/Los_Angeles' });
  const tick = () => { el.textContent = fmt.format(new Date()); };
  tick(); setInterval(tick, 1000);
})();
</script>
<script>
// Always open a page at its top, so the cover is the first thing you see —
// even when you arrive from a page that was scrolled down (e.g. the bottom of the Archive).
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
(function () {
  const show = () => document.documentElement.classList.remove('sw-hold');
  if (location.hash) { show(); return; }
  const toTop = () => { window.scrollTo(0, 0); document.documentElement.scrollIntoView({ block: 'start' }); };
  toTop();
  // stay hidden until the page (and the cover) has loaded and sits at the top, then fade in
  addEventListener('load', () => { toTop(); setTimeout(() => { toTop(); requestAnimationFrame(show); }, 60); });
})();
</script>
<script>
// No single word alone on a paragraph's last line: tie the last two words together
// (backup for browsers without text-wrap: pretty)
(function () {
  const sel = 'p, h1, h2, h3, dd, li, .tile-meta span, .more-meta span, .card-title span';
  const fix = el => {
    const walk = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    let last = null; while (walk.nextNode()) if (walk.currentNode.nodeValue.trim()) last = walk.currentNode;
    if (!last || el.textContent.trim().split(/\s+/).length < 4) return;
    last.nodeValue = last.nodeValue.replace(/\s+(\S+)\s*$/, '\u00A0$1');
  };
  const run = () => document.querySelectorAll(sel).forEach(fix);
  run(); addEventListener('load', run);
})();
</script>
