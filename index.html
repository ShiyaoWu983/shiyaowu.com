<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shiyao Wu — Graphic Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Newsreader:opsz,wght@6..72,400&display=swap">
<style>
/* No single word left alone on the last line of a paragraph */
p, h1, h2, h3, dd, li, .block-copy, .card-title, .tile-meta span, .more-meta span { text-wrap: pretty; }
</style>
<style>
/* Direction 3 — studio-style one-pager, modeled on the serious.business framework:
   full-width wordmark → mixed-type hero + expanding reel → stat ticker + statement →
   stacked service bands (accordion) → 2-up project grid → recognition list → CTA footer.
   24px frame. Mixed titles = sans line + serif line. All content is placeholder. */
:root {
  --bg: #F3F3F3;
  --fg: #000000;
  --muted: #8C8C8C;
  --ph: #C4C4C4;
  --ph-ink: #9A9A9A;
  --pill: #FFFFFF;
  /* service bands — placeholder colors, swap for the brand palette later */
  --band-1: #DCDCDC;
  --band-2: #FFFFFF;
  --band-3: #C4C4C4;
  --band-4: #1E1E1E;
  --band-4-ink: #F3F3F3;

  --sans: 'Inter', -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --serif: 'Newsreader', 'Times New Roman', Georgia, serif;

  --fs-xs: 11px;
  --fs-s: 13px;
  --fs-m: clamp(17px, 1.67vw, 23px);     /* hero / section subtitles */
  --fs-l: clamp(31px, 5vw, 71px);        /* statements */
  --fs-xl: clamp(43px, 7.3vw, 104px);    /* service band titles */

  --frame: 24px;
  --gap: 16px;
  --radius: 6px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  font-size: var(--fs-s);
  line-height: 1.3;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
p, h1, h2, h3, h4 { margin: 0; font-weight: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }

.frame { padding-inline: var(--frame); }

/* ---------- Shared bits ---------- */
.mixed { display: flex; flex-direction: column; align-items: center; text-align: center; line-height: 1; text-wrap: balance; }
.mixed .main { font-family: var(--sans); font-weight: 500; letter-spacing: -0.01em; }
.mixed .sub { font-family: var(--serif); font-weight: 400; }

.pill {
  display: inline-flex; align-items: center; height: 39px;
  font-size: 15px; font-weight: 500;   /* same size as header + project text */
}
@media (max-width: 640px) { .pill { font-size: 13px; } }
.pill .label { background: var(--pill); border-radius: 20px; padding: 0 18px; height: 100%; display: flex; align-items: center; }
.pill .dot {
  width: 39px; height: 39px; border-radius: 50%; background: var(--pill);
  display: grid; place-items: center; transition: transform .25s ease;
}
.pill:hover .dot { transform: rotate(-45deg); }
.pill:hover .label { background: var(--fg); color: var(--bg); }
.pill .label, .pill .dot { transition: background .2s, color .2s, transform .25s; }

.ph { position: relative; background: var(--ph); border-radius: var(--radius); overflow: hidden; }
.ph-label { position: absolute; left: 12px; bottom: 10px; font-size: var(--fs-xs); color: var(--ph-ink); font-variant-numeric: tabular-nums; }
.ph img, .ph video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

.section-label { font-size: var(--fs-s); font-weight: 500; }

/* ---------- Fixed nav (pills) ---------- */
.nav {
  position: fixed; z-index: 20; left: 0; right: 0;
  top: calc(env(safe-area-inset-top, 0px) + 16px);
  display: flex; justify-content: space-between;
  padding-inline: var(--frame);
  pointer-events: none;
  opacity: 0; transform: translateY(-8px);
  transition: opacity .25s ease, transform .25s ease;
}
.nav.is-on { opacity: 1; transform: none; }
.nav .pill { pointer-events: auto; }

/* ---------- Menu overlay ---------- */
.menu {
  position: fixed; inset: 0; z-index: 30;
  background: var(--fg); color: var(--bg);
  padding: calc(env(safe-area-inset-top, 0px) + 24px) var(--frame) 24px;
  display: flex; flex-direction: column; justify-content: space-between;
}
[hidden] { display: none !important; }
.menu .menu-close { align-self: flex-end; font-size: var(--fs-s); font-weight: 500; border: 1px solid currentColor; border-radius: 20px; height: 39px; padding: 0 18px; }
.menu nav { display: flex; flex-direction: column; }
.menu nav a { font-size: var(--fs-xl); font-weight: 500; line-height: 1.05; letter-spacing: -0.02em; }
.menu nav a:hover { font-family: var(--serif); font-weight: 400; }
.menu .menu-foot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: var(--fs-s); }

/* ---------- Hero ---------- */
.hero { padding-block: var(--bar-h, 69px) 0; position: relative; }   /* exactly the header's height, so the gap to the first images equals the side margin */
.wordmark { display: block; width: 100%; height: auto; }
.wordmark text { font-family: var(--sans); font-weight: 800; fill: var(--fg); }
/* Title line sits on top of the reel. White + difference blend = the opposite color of what's behind it. */
.hero-name {
  position: absolute; z-index: 5; top: 0; left: var(--frame); right: var(--frame);
  padding-top: 80px;   /* just below the header bar */
  mix-blend-mode: difference;
  pointer-events: none;
}
.hero-role { color: #FFFFFF; font-size: var(--fs-m); font-weight: 500; margin: 0; }
/* Reel scrolls with the page; the project gallery follows right after it */
.reel { padding-top: var(--frame); }
/* Dark placeholder so the name's color flip is visible before real footage goes in */
.reel .ph { background: var(--band-4); }
.reel .ph-label { color: #6E6E6E; }
.reel .ph { height: min(calc((100vw - 2 * var(--frame)) * 9 / 16), calc(100vh - 2 * var(--frame))); border-radius: var(--radius); }
.reel-play {
  position: absolute; right: 16px; bottom: 12px;
  font-size: var(--fs-xs); font-weight: 500;
  background: var(--pill); border-radius: 20px; padding: 8px 14px;
}

/* ---------- Facts ---------- */
.facts { padding-block: 160px 0; }
.ticker { overflow: hidden; mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); }
.ticker-track { display: flex; gap: 24px; width: max-content; animation: tick 28s linear infinite; }
.ticker:hover .ticker-track { animation-play-state: paused; }
.stat { width: 200px; display: flex; flex-direction: column; gap: 6px; }
.stat .num { font-size: 39px; font-weight: 500; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.stat .cap { font-size: var(--fs-xs); color: var(--muted); }
@keyframes tick { to { transform: translateX(-50%); } }
.statement { display: flex; flex-direction: column; gap: 28px; align-items: flex-start; }
.statement h2 { font-size: var(--fs-l); line-height: 1; letter-spacing: -0.02em; font-weight: 500; text-wrap: balance; max-width: 18ch; }
.statement h2 em { font-family: var(--serif); font-style: normal; font-weight: 400; }

/* ---------- Services (stacked bands) ---------- */
.services { padding-top: 200px; }
.services .section-label { padding-inline: var(--frame); margin-bottom: 12px; display: block; }
.band { background: var(--c); color: var(--ink, var(--fg)); }
.band:nth-child(1) { --c: var(--band-1); }
.band:nth-child(2) { --c: var(--band-2); }
.band:nth-child(3) { --c: var(--band-3); }
.band:nth-child(4) { --c: var(--band-4); --ink: var(--band-4-ink); }
.band-head {
  width: 100%; text-align: left; display: flex; justify-content: space-between; align-items: center;
  padding: 0 var(--frame); min-height: 1.4em;
  font-size: var(--fs-xl); font-weight: 500; letter-spacing: -0.03em; line-height: 1;
}
.band-head .plus { font-size: 0.4em; font-weight: 400; transition: transform .3s ease; }
.band.is-open .band-head .plus { transform: rotate(45deg); }
.band-body {
  display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s ease;
}
.band.is-open .band-body { grid-template-rows: 1fr; }
.band-body > div { overflow: hidden; }
.band-inner {
  display: grid; grid-template-columns: 2fr 1fr 3fr; gap: 24px var(--gap);
  padding: 8px var(--frame) 32px;
}
/* Horizontal image strip inside each discipline — bleeds to the right edge */
.band-strip {
  grid-column: 1 / -1;
  display: flex; gap: var(--gap);
  margin-right: calc(-1 * var(--frame)); padding-right: var(--frame);
  overflow-x: auto; overscroll-behavior-x: contain;
  scroll-snap-type: x mandatory; scrollbar-width: none;
  cursor: grab;
}
.band-strip::-webkit-scrollbar { display: none; }
.band-strip.is-dragging { cursor: grabbing; scroll-snap-type: none; user-select: none; }
.band-strip:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
.band-strip .ph { flex: 0 0 auto; height: clamp(220px, 26vw, 380px); scroll-snap-align: start; }
.band-strip .ph--wide { aspect-ratio: 3 / 2; }
.band-strip .ph--tall { aspect-ratio: 4 / 5; }
.strip-hint { grid-column: 1 / -1; display: flex; justify-content: space-between; font-size: var(--fs-xs); opacity: .6; margin-top: -12px; }
.band-inner p { font-size: var(--fs-m); line-height: 1.15; max-width: 26ch; }
.band-inner ul { list-style: none; margin: 0; padding: 0; font-size: var(--fs-xs); line-height: 1.5; }

/* ---------- Work ---------- */
.work { padding-block: var(--frame) 0; }   /* gallery starts one margin below the header */
.work .mixed { font-size: var(--fs-l); margin-bottom: 64px; }
.work .mixed .main { font-weight: 500; letter-spacing: -0.02em; }
.work-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--frame); }   /* same as the site's outer margin */
.card { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card--reel { grid-column: 1 / -1; }
.card--reel .ph { aspect-ratio: 16 / 9; }
.card--reel .ph-label { color: #6E6E6E; }
.card .ph { aspect-ratio: 5 / 3;   /* between the old 3:2 and 16:9 */ max-width: 100%; transition: border-radius .3s ease; background: transparent; }
.card .ph-media { position: absolute; inset: 0; background: var(--ph); }
/* Scroll effect (after kaaka.co.jp): each project slowly fades in while rising a little,
   one after another, as it comes into view. Plays once per project. */
.js-fade .card {
  opacity: 0; transform: translateY(40px);
  transition: opacity 1.4s cubic-bezier(.25,.46,.45,.94), transform 1.4s cubic-bezier(.25,.46,.45,.94);
  transition-delay: var(--d, 0s);
}
.js-fade .card .ph-media { opacity: 0; transition: opacity 1.2s ease; transition-delay: calc(var(--d, 0s) + .25s); }
.js-fade .card.is-in { opacity: 1; transform: none; }
.js-fade .card.is-in .ph-media { opacity: 1; }
.card--reel .ph-media { background: var(--band-4); }

@media (hover: hover) and (pointer: fine) and (min-width: 901px) { .card:hover .ph { border-radius: 24px; } }   /* no corner change on phones, tablets or touch screens */
.card-meta { display: flex; flex-direction: column; gap: 2px; font-size: 15px; line-height: 1.3; }   /* same size as the header */
@media (max-width: 640px) { .card-meta { font-size: 13px; } }
.card-title { font-size: inherit; font-weight: 500; }
.card-title span { background: linear-gradient(currentColor, currentColor) 0 100% / 0 1px no-repeat; transition: background-size .3s ease; }
.card-tags { font-size: inherit; color: var(--muted); }
.work-more { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-bottom: 56px; }   /* centered between the last projects and the city + time (56px above and below) */

/* ---------- Recognition ---------- */
.recog { padding-block: 200px 0; }
.recog .mixed { font-size: var(--fs-l); margin-bottom: 48px; }
.recog-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 48px var(--gap); align-items: start; }
.recog-col h3 { font-size: var(--fs-s); font-weight: 500; margin-bottom: 12px; }
.recog-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--fg); }
.recog-list li {
  display: grid; grid-template-columns: 1fr auto; gap: 4px var(--gap); align-items: baseline;
  padding: 18px 0; border-bottom: 1px solid var(--fg); font-size: var(--fs-m);
}
.recog-list .what { grid-column: 1 / -1; grid-row: 2; font-size: var(--fs-s); color: var(--muted); }
.recog-list .yr { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.recog-list li:hover { padding-left: 12px; }
.recog-list li { transition: padding .25s ease; }

/* ---------- Footer ---------- */
.footer { padding-block: 56px 24px; }
.cta { display: flex; flex-direction: column; align-items: center; gap: 28px; }
.cta .mixed { font-size: var(--fs-l); }
.foot-cols { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--gap); margin-top: 180px; }
.foot-cols h4 { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 10px; font-weight: 500; }
.foot-cols a { display: block; font-size: var(--fs-m); line-height: 1.2; }
.foot-cols a:hover { font-family: var(--serif); }
.foot-bottom {
  display: grid; grid-template-columns: 1fr auto 1fr; gap: var(--gap); margin-top: 0;
  font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.04em;
}
.foot-bottom > :last-child { justify-self: end; }
.footer .wordmark { margin-top: 24px; }

/* ---------- Tablet ---------- */
@media (max-width: 1000px) {
  .facts { grid-template-columns: 1fr; padding-top: 120px; gap: 48px; }
  .band-inner { grid-template-columns: 1fr 1fr; }
  .foot-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 32px; }
  .footer { padding-top: 80px; }
}
/* ---------- Phone ---------- */
@media (max-width: 640px) {
  :root { --frame: 16px; }
  .work-grid { grid-template-columns: 1fr; }
  .band-inner { grid-template-columns: 1fr; }
  .recog-cols { grid-template-columns: 1fr; }
  .foot-bottom { grid-template-columns: 1fr; }
  .foot-bottom > :last-child { justify-self: start; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition: none !important; }
}

/* ---------- Header (after yimao.design): pinned flat bar + intro block that scrolls ---------- */
.site-bar {
  position: fixed; z-index: 30; top: 0; left: 0; right: 0;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) var(--frame) 14px;
  background: var(--bg);
  display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); column-gap: var(--frame); align-items: baseline;   /* after zefengd.com: name spans the left half; links take the 3 columns of the right half, which lines up with the gallery's right column */
  font-size: 18px; font-weight: 700; line-height: 1.3; color: var(--fg);   /* one size for every header item */
}
.site-bar a { transition: opacity .2s; }
.site-bar .bar-id { grid-column: span 3; display: flex; flex-direction: column; align-items: flex-start; }   /* name with a short intro underneath */
.site-bar .bar-last { grid-column: 6; justify-self: end; }   /* About Me on the right edge */
.site-bar .bar-intro { margin: 20px 0 0; font-size: 15px; font-weight: 400; color: var(--fg); }   /* short intro under the name */
/* homepage only: contact links under Archive, same grey line as the intro */
.site-bar .bar-col { display: flex; flex-direction: column; align-items: flex-start; }
.site-bar .bar-contact { margin: 20px 0 0; font-size: 15px; font-weight: 400; color: var(--fg); display: flex; flex-wrap: nowrap; white-space: nowrap; gap: 16px; }
.bar-contact .ic { width: 1em; height: 1em; vertical-align: -0.14em; margin-right: 0.35em; flex: none; }

.site-bar .bar-contact a:hover { opacity: 1; color: var(--fg); }
.bar-contact a { display: inline-flex; align-items: center; }
.bar-contact .ic-f { display: none; }
.bar-contact a:hover .ic-o { display: none; }
.bar-contact a:hover .ic-f { display: inline-block; }
.site-bar { align-items: start; }
.site-bar a:hover, .site-bar a[aria-current="page"] { opacity: .45; }
.intro { padding-top: calc(env(safe-area-inset-top, 0px) + 50px); font-size: 12px; font-weight: 500; line-height: 1.3; }
.intro hr { border: 0; border-top: 1px solid var(--fg); margin: 0; }
.intro-row { display: grid; grid-template-columns: 34% 34% 1fr; gap: 0; padding-block: 20px 22px; }
.intro-row > div { padding-right: var(--frame); max-width: 62ch; }
.intro-row .lbl { display: block; }
.intro-ticker { overflow: hidden; white-space: nowrap; padding-block: 7px; }
.intro-ticker .track { display: inline-flex; gap: 4em; animation: intro-tick 40s linear infinite; }
.intro-ticker:hover .track { animation-play-state: paused; }
@keyframes intro-tick { to { transform: translateX(-50%); } }
@media (max-width: 900px) {
  .site-bar { grid-template-columns: 1fr auto auto auto; gap: 0 16px; font-size: 15px; }
  .site-bar .bar-intro, .site-bar .bar-contact { display: none; }
  .site-bar .bar-id { grid-column: auto; }
  .site-bar .bar-last { grid-column: auto; }
  .intro-row { grid-template-columns: 1fr; gap: 14px; }
}
@media (prefers-reduced-motion: reduce) { .intro-ticker .track { animation: none; } }


/* ---------- Opening preloader (after the Skiper UI / Dennis Snellenberg words preloader) ----------
   Dark screen, your name fixed in the center, highlight images from each project cutting behind it.
   Then the whole screen lifts away with a curved bottom edge that flattens as it goes. */
.splash {
  position: fixed; inset: 0; z-index: 200;
  background: #141414; color: #FFFFFF;
  will-change: transform;
}
.splash-curve { position: absolute; left: 0; top: 100%; width: 100%; height: 22vh; overflow: visible; pointer-events: none; }
.splash-curve path { fill: #141414; }
.splash-stage {
  position: absolute; inset: 0;   /* images fill the whole screen (full bleed) */
  opacity: 0; transition: opacity .4s ease;
}
.splash.is-on .splash-stage { opacity: 1; }
.splash .sf::after { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,.38); pointer-events: none; }   /* dims the images so the name stands out */
.splash .sf { position: absolute; inset: 0; opacity: 0; display: flex; align-items: flex-end; padding: var(--frame); }
.splash .sf img, .splash .sf video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.splash .sf:last-child { bottom: -22vh; }   /* only the last image runs down into the curved edge */
.splash .sf:last-child img { object-position: 50% 41%; }
.splash-curve { display: none; }
.splash .sf.on { opacity: 1; }
.splash .sf span { font-size: 10px; color: rgba(255,255,255,.55); mix-blend-mode: difference; }
.splash .sf:nth-child(1) { background: #4A4A4A; }
.splash .sf:nth-child(2) { background: #B9B9B9; }
.splash .sf:nth-child(3) { background: #6E6E6E; }
.splash .sf:nth-child(4) { background: #D6D6D6; }
.splash .sf:nth-child(5) { background: #333333; }
.splash .sf:nth-child(6) { background: #9A9A9A; }
.splash-name {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  font-size: clamp(39px, 9vw, 159px); font-weight: 700; letter-spacing: -0.02em; line-height: 1; text-transform: uppercase; white-space: nowrap;
  color: #FFFFFF; z-index: 2; text-shadow: 0 2px 24px rgba(0,0,0,.25);   /* solid white, readable on every image */
  display: flex; align-items: center; gap: .35em;
  opacity: 0; transition: opacity .4s ease;
}
.splash.is-on .splash-name { opacity: 1; }

/* After the logo, the page settles in: header first, then the cards one by one */
.is-intro .site-bar { opacity: 0; transform: translateY(10px); }
.is-revealed .site-bar { opacity: 1; transform: none; transition: opacity .6s ease, transform .6s ease; }
.foot-time { font-variant-numeric: tabular-nums; margin-left: .4em; }

/* Replay-intro button: on the left, on the same line as See all projects */
.foot-end { display: inline-flex; line-height: 1; align-items: center; gap: 14px; }
.replay {
  display: inline-flex; align-items: center; gap: 0;
  height: 24px; padding: 0 3px; border-radius: 12px; margin: -6px 0;
  background: var(--fg); color: var(--bg);
  font: inherit; text-transform: uppercase; letter-spacing: 0.04em; cursor: pointer;
  transition: gap .3s ease, padding .3s ease, transform .3s cubic-bezier(.3,1.6,.5,1);
}
.replay .ri { width: 18px; height: 18px; border-radius: 50%; flex: none; display: grid; place-items: center; }
.replay svg { width: 13px; height: 13px; transition: transform .7s cubic-bezier(.5,-0.5,.3,1.5); }
.replay .rl { max-width: 0; opacity: 0; overflow: hidden; white-space: nowrap; transition: max-width .3s ease, opacity .2s ease; }
.replay:hover { gap: 4px; padding: 0 10px 0 3px; }
.replay:hover .rl { max-width: 120px; opacity: 1; }
.replay:hover svg { transform: rotate(-360deg); }
.replay:active { transform: scale(.9); }
.replay.spin svg { transform: rotate(-720deg); transition-duration: .9s; }

/* Footer always sits at the bottom of the screen, even on short pages */
body { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
body > footer.footer { margin-top: auto; }

/* Tags under a title: one step smaller than the title (13px, 12px on phone) */
.card .card-tags, .tile-meta .cats, .more-meta .cats { font-size: 13px; }
@media (max-width: 640px) { .card .card-tags, .tile-meta .cats, .more-meta .cats { font-size: 12px; } }

/* Subtitle under the name in the opening */
.splash-sub {
  position: absolute; left: 50%; top: 50%; z-index: 2; white-space: nowrap;
  transform: translate(-50%, calc(clamp(39px, 9vw, 159px) * 0.5 + clamp(10px, 1.2vw, 22px)));
  font-size: clamp(24px, 3.4vw, 56px); font-weight: 500; letter-spacing: 0.01em; color: #FFFFFF;
  text-shadow: 0 2px 16px rgba(0,0,0,.25); opacity: 0; transition: opacity .4s ease .15s;
}

// ---------- Scroll effect: projects slowly fade in, one by one, as they enter the screen ----------
let revealStarted = false;
function startReveal() {
  if (revealStarted) return; revealStarted = true;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches || !('IntersectionObserver' in window)) return;
  document.documentElement.classList.add('js-fade');
  const cards = [...document.querySelectorAll('.card')];
  const io = new IntersectionObserver(entries => {
    const entering = entries.filter(e => e.isIntersecting).sort((a, b) => (a.boundingClientRect.top - b.boundingClientRect.top) || (a.boundingClientRect.left - b.boundingClientRect.left));
    entering.forEach((e, k) => {
      e.target.style.setProperty('--d', (k * 0.18) + 's');   // one after another
      e.target.classList.add('is-in');
      io.unobserve(e.target);
    });
  }, { threshold: 0.15, rootMargin: '0px 0px -8% 0px' });
  // Projects already on screen when the page opens just show; the fade only plays for ones you scroll to
  const vh = innerHeight;
  cards.forEach(c => {
    if (c.getBoundingClientRect().top < vh) {
      c.style.transition = 'none'; c.querySelector('.ph-media').style.transition = 'none';
      c.classList.add('is-in');
      requestAnimationFrame(() => requestAnimationFrame(() => { c.style.transition = ''; c.querySelector('.ph-media').style.transition = ''; }));
    } else io.observe(c);
  });
}

// ---------- Opening preloader, then reveal (also used by the replay button) ----------
function playSplash(splash, first) {
  const root = document.documentElement;
  const frames = [...splash.querySelectorAll('.sf')];
  const path = splash.querySelector('path');
  const STEP = 260;                       // ms per highlight image
  let i = 0, timer, done = false;
  root.style.overflow = 'hidden';
  requestAnimationFrame(() => splash.classList.add('is-on'));
  // wait (max 1.5s) for the highlight images so each one is ready before it flashes
  const ready = Promise.race([Promise.all([...splash.querySelectorAll('img')].map(im => im.decode().catch(() => {}))), new Promise(r => setTimeout(r, 1500))]);
  ready.then(() => setTimeout(() => {
    timer = setInterval(() => {
      if (i >= frames.length - 1) { clearInterval(timer); setTimeout(finish, 380); return; }
      frames[i].classList.remove('on'); i++; frames[i].classList.add('on');
    }, STEP);
  }, 350));
  function finish() {
    if (done) return; done = true; clearInterval(timer);
    try { sessionStorage.setItem('sw-splash-seen', '1'); } catch (e) {}
    root.style.overflow = '';
    if (first) { root.classList.add('is-revealed'); startReveal(); }
    // lift the screen up; the curved bottom edge flattens on the way
    // the screen plus a curved bottom edge; the last image shows through the curve too
    const clip = e => { const W = innerWidth, H = innerHeight, c = H * 0.22 * (1 - e);
      splash.style.clipPath = `path('M0 0 L${W} 0 L${W} ${H} Q${W / 2} ${H + 2 * c} 0 ${H} Z')`; };
    clip(0);
    const D = 900, ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    const t0 = performance.now();
    (function step(now) {
      const t = Math.min(1, (now - t0) / D), e = ease(t);
      splash.style.transform = `translateY(${-e * 122}vh)`;
      clip(e);
      if (t < 1) requestAnimationFrame(step);
      else { splash.remove(); if (first) root.classList.remove('is-intro', 'is-revealed'); }
    })(t0);
  }
  splash.addEventListener('click', finish);   // click to skip
}
(function () {
  const splash = document.getElementById('splash');
  if (!splash) { startReveal(); return; }
  playSplash(splash, true);
})();
// Replay button (bottom-left corner)
document.getElementById('replayIntro').addEventListener('click', () => {
  const btn = document.getElementById('replayIntro'); btn.classList.add('spin'); setTimeout(() => btn.classList.remove('spin'), 900);

});

<script>
// No single word alone on a paragraph's last line: tie the last two words together
// (backup for browsers without text-wrap: pretty)
(function () {
  const sel = 'p, h1, h2, h3, dd, li, .tile-meta span, .more-meta span, .card-title span';
  const fix = el => {
    const walk = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    let last = null; while (walk.nextNode()) if (walk.currentNode.nodeValue.trim()) last = walk.currentNode;
    if (!last || el.textContent.trim().split(/\s+/).length < 4) return;
    last.nodeValue = last.nodeValue.replace(/\s+(\S+)\s*$/, '\u00A0$1');
  };
  const run = () => document.querySelectorAll(sel).forEach(fix);
  run(); addEventListener('load', run);
})();
</script>
